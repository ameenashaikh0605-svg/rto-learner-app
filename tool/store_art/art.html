<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;padding:0;background:transparent}
.bg{background:linear-gradient(145deg,#2F6FD0,#1F4E9C 60%,#173B78)}
.plate{background:#fff;border-radius:14%;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(0,0,0,.28);position:relative}
.L{font-family:'Inter Display','Inter',sans-serif;font-weight:900;color:#D32F2F;line-height:1}
.tick{position:absolute;right:-9%;bottom:-9%;width:38%;height:38%;border-radius:50%;background:#2E9E44;border:4px solid #fff;display:flex;align-items:center;justify-content:center}
</style></head><body>
<div id="icon" class="bg" style="width:512px;height:512px;display:flex;align-items:center;justify-content:center">
  <div class="plate" style="width:300px;height:300px"><span class="L" style="font-size:250px">L</span>
  <div class="tick"><svg viewBox="0 0 24 24" width="70%" height="70%"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg></div></div>
</div>
<div id="fg" style="width:432px;height:432px;display:flex;align-items:center;justify-content:center">
  <div class="plate" style="width:210px;height:210px"><span class="L" style="font-size:175px">L</span>
  <div class="tick" style="border-width:3px"><svg viewBox="0 0 24 24" width="70%" height="70%"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg></div></div>
</div>
<div id="feature" class="bg" style="width:1024px;height:500px;display:flex;align-items:center;gap:56px;padding:0 72px;box-sizing:border-box;font-family:'Inter',sans-serif;color:#fff">
  <div class="plate" style="width:260px;height:260px;flex:none"><span class="L" style="font-size:215px">L</span>
  <div class="tick"><svg viewBox="0 0 24 24" width="70%" height="70%"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg></div></div>
  <div><div style="font-family:'Inter Display','Inter';font-weight:800;font-size:58px;line-height:1.08">Pass your<br>learner's licence test</div>
  <div style="font-size:25px;margin-top:22px;white-space:nowrap;opacity:.92">Road signs · Traffic rules · Timed mock tests</div></div>
</div>
</body></html>
