name: Launch test on emulator

# Installs the release APK on an Android emulator, opens it, and saves the
# device log so startup crashes can be diagnosed without a phone.
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  launch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.7"
          channel: stable
      - run: flutter build apk --release
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          script: |
            adb install build/app/outputs/flutter-apk/app-release.apk
            adb logcat -c
            adb shell monkey -p com.rafapps.rtolearner -c android.intent.category.LAUNCHER 1
            sleep 25
            adb logcat -d > logcat.txt
            adb exec-out screencap -p > screen.png
            grep -E "FATAL|AndroidRuntime|flutter" logcat.txt | tail -80
            adb shell pidof com.rafapps.rtolearner && echo "APP_RUNNING" || (echo "APP_NOT_RUNNING: the app crashed or closed on launch" && exit 1)
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: launch-test
          path: |
            logcat.txt
            screen.png
